name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install validation tools
        run: brew install swiftlint cocoapods

      - name: Run Swift tests
        run: swift test

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -scheme IONNativeIslandsLib
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO

      - name: Lint Swift
        run: swiftlint --strict

      - name: Validate podspec
        run: pod lib lint IONNativeIslandsLib.podspec
